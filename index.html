<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Poll</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.opt-card:hover .opt-num { --tw-bg-opacity: 1; background-color: rgb(238 242 255 / var(--tw-bg-opacity)); color: #6366f1; }
.bar-fill { transition: width .6s cubic-bezier(.22,1,.36,1); }
</style>
</head>
<body class="min-h-screen flex justify-center p-8 bg-gradient-to-br from-indigo-500 to-purple-600 text-[#1a1a2e]">
<div id="app" class="w-full max-w-[480px] flex flex-col gap-4">
  <template v-if="mode === 'create'">
    <div class="bg-white rounded-2xl p-7 shadow-[0_8px_32px_rgba(0,0,0,0.15)]">
      <h1 class="text-[1.35rem] font-bold mb-5 leading-tight break-words">Create a Poll</h1>
      <template v-if="!shareUrl">
        <label class="block text-xs font-semibold mb-1 text-slate-500 uppercase tracking-wider">Question</label>
        <input v-model="question" type="text" placeholder="What's your question?" ref="qInput" maxlength="200" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-[0.9375rem] mb-3 transition-colors bg-slate-50 focus:outline-none focus:border-indigo-500 focus:ring-3 focus:ring-indigo-500/15 focus:bg-white">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Options</div>
        <div v-for="(opt, i) in options" :key="i" class="flex gap-2 items-center">
          <input v-model="options[i]" type="text" :placeholder="'Option ' + (i + 1)" maxlength="100" class="flex-1 w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-[0.9375rem] transition-colors bg-slate-50 focus:outline-none focus:border-indigo-500 focus:ring-3 focus:ring-indigo-500/15 focus:bg-white">
          <button v-if="options.length > 2" @click="options.splice(i, 1)" class="bg-none border-none text-slate-400 hover:text-red-500 text-xl cursor-pointer p-1 leading-none">&times;</button>
        </div>
        <button v-if="options.length < 5" @click="options.push('')" class="mt-1 inline-flex items-center justify-center px-5 py-2.5 rounded-xl text-xs font-medium cursor-pointer border border-slate-200 bg-transparent text-slate-500 hover:border-indigo-500 hover:text-indigo-500 transition-all">+ Add option</button>
        <button @click="createPoll" :disabled="!valid" class="mt-3 inline-flex items-center justify-center px-5 py-3 rounded-xl text-[0.9375rem] font-semibold cursor-pointer border-none transition-all bg-gradient-to-r from-indigo-500 to-purple-600 text-white w-full hover:-translate-y-0.5 hover:shadow-[0_4px_12px_rgba(102,126,234,0.4)] disabled:opacity-40 disabled:cursor-not-allowed">Create Poll</button>
      </template>
      <div v-else class="bg-green-50 border border-green-200 rounded-xl p-5">
        <p class="text-xs text-green-800 mb-2 font-medium">Share this link:</p>
        <div class="text-xs text-indigo-500 bg-white px-3 py-2.5 rounded-lg border border-green-200 break-all select-all">{{ shareUrl }}</div>
        <div class="flex gap-2 mt-2.5">
          <button @click="copyLink" class="flex-1 inline-flex items-center justify-center px-5 py-2.5 rounded-xl text-xs font-medium cursor-pointer border border-slate-200 bg-transparent text-slate-500 hover:border-indigo-500 hover:text-indigo-500 transition-all">{{ copied ? 'Copied!' : 'Copy link' }}</button>
          <button @click="goHome" class="flex-1 inline-flex items-center justify-center px-5 py-2.5 rounded-xl text-xs font-medium cursor-pointer border border-slate-200 bg-transparent text-slate-500 hover:border-indigo-500 hover:text-indigo-500 transition-all">Create another</button>
        </div>
      </div>
    </div>
  </template>
  <template v-else-if="mode === 'vote'">
    <div class="bg-white rounded-2xl p-7 shadow-[0_8px_32px_rgba(0,0,0,0.15)]">
      <h1 class="text-[1.35rem] font-bold mb-5 leading-tight break-words">{{ poll.question }}</h1>
      <div v-if="!voted">
        <div v-for="(opt, i) in poll.options" :key="i" class="group flex items-center gap-3 px-4 py-3.5 border-2 border-slate-200 rounded-xl mb-2.5 cursor-pointer transition-all hover:border-indigo-500 hover:bg-indigo-50/50 hover:translate-x-1 active:translate-x-1 active:scale-[0.99]" @click="vote(i)">
          <span class="opt-num w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500 shrink-0 transition-colors">{{ i + 1 }}</span>
          <span class="font-medium">{{ opt.text }}</span>
        </div>
      </div>
      <div v-else>
        <div v-for="(opt, i) in poll.options" :key="i" class="mb-2.5 last:mb-0">
          <div class="relative px-4 py-3.5 rounded-xl overflow-hidden bg-slate-50">
            <div class="bar-fill absolute inset-0 bg-gradient-to-r from-indigo-100 to-indigo-200 rounded-xl" :style="{ width: pct(i) + '%' }"></div>
            <div class="relative flex justify-between items-center z-10">
              <span class="font-semibold text-[0.9375rem] break-words pr-2">{{ opt.text }}</span>
              <span class="text-indigo-600 font-bold text-sm whitespace-nowrap">{{ pct(i) }}% <span class="text-slate-400 text-xs ml-1">({{ opt.votes }})</span></span>
            </div>
          </div>
        </div>
        <div class="text-center text-slate-400 text-xs mt-4 pt-4 border-t border-slate-100">{{ totalVotes }} vote{{ totalVotes !== 1 ? 's' : '' }}</div>
      </div>
    </div>
  </template>
  <template v-else-if="mode === 'notfound'">
    <div class="bg-white rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.15)] text-center py-10 px-7">
      <div class="text-4xl mb-3">?</div>
      <h1 class="text-[1.35rem] font-bold mb-2 leading-tight break-words">Poll not found</h1>
      <p class="text-slate-400 text-sm mb-5">This poll doesn't exist or has been removed.</p>
      <button @click="goHome" class="inline-flex items-center justify-center px-5 py-3 rounded-xl text-[0.9375rem] font-semibold cursor-pointer border-none transition-all bg-gradient-to-r from-indigo-500 to-purple-600 text-white hover:-translate-y-0.5 hover:shadow-[0_4px_12px_rgba(102,126,234,0.4)]">Create a poll</button>
    </div>
  </template>
</div>
<script>
const POLLS_KEY = 'quickpoll_polls'
const VOTED_KEY = 'quickpoll_voted'

function load(k) { try { return JSON.parse(localStorage.getItem(k)) || {} } catch { return {} } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }

const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue

createApp({
  setup() {
    const mode = ref('create')
    const question = ref('')
    const options = ref(['', ''])
    const shareUrl = ref('')
    const pollId = ref('')
    const poll = ref(null)
    const voted = ref(false)
    const copied = ref(false)
    const qInput = ref(null)

    const valid = computed(() => question.value.trim() && options.value.filter(o => o.trim()).length >= 2)

    function createPoll() {
      if (!valid.value) return
      const opts = options.value.filter(o => o.trim()).map(text => ({ text: text.trim(), votes: 0 }))
      const id = genId()
      const polls = load(POLLS_KEY)
      polls[id] = { question: question.value.trim(), options: opts }
      save(POLLS_KEY, polls)
      shareUrl.value = location.origin + location.pathname + '#' + id
    }

    function copyLink() {
      navigator.clipboard.writeText(shareUrl.value).then(() => {
        copied.value = true
        setTimeout(() => { copied.value = false }, 2000)
      }).catch(() => {})
    }

    function loadPoll(id) {
      if (!id) return
      const polls = load(POLLS_KEY)
      if (!polls[id]) { mode.value = 'notfound'; return }
      pollId.value = id
      poll.value = polls[id]
      voted.value = !!load(VOTED_KEY)[id]
      mode.value = 'vote'
    }

    function vote(idx) {
      if (voted.value) return
      const polls = load(POLLS_KEY)
      const p = polls[pollId.value]
      if (!p || !p.options[idx]) return
      p.options[idx].votes++
      save(POLLS_KEY, polls)
      poll.value = p
      voted.value = true
      const v = load(VOTED_KEY)
      v[pollId.value] = true
      save(VOTED_KEY, v)
    }

    function pct(i) {
      const total = poll.value.options.reduce((s, o) => s + o.votes, 0)
      return total === 0 ? 0 : Math.round(poll.value.options[i].votes / total * 100)
    }

    const totalVotes = computed(() => poll.value ? poll.value.options.reduce((s, o) => s + o.votes, 0) : 0)

    function goHome() {
      location.hash = ''
      mode.value = 'create'
      shareUrl.value = ''
      copied.value = false
      pollId.value = ''
      question.value = ''
      options.value = ['', '']
      nextTick(() => qInput.value?.focus())
    }

    function onHashChange() {
      const id = location.hash.slice(1)
      if (id) loadPoll(id)
      else goHome()
    }

    onMounted(() => {
      onHashChange()
      window.addEventListener('hashchange', onHashChange)
    })

    onUnmounted(() => window.removeEventListener('hashchange', onHashChange))

    return { mode, question, options, shareUrl, poll, voted, copied, qInput, valid, createPoll, copyLink, vote, pct, totalVotes, goHome }
  }
}).mount('#app')
</script>
</body>
</html>
