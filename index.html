<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Poll</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
#app { width: 100%; max-width: 480px; }
.card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; }
label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .25rem; color: #555; }
input[type="text"] { width: 100%; padding: .625rem .75rem; border: 1px solid #ddd; border-radius: 8px; font-size: .9375rem; margin-bottom: .75rem; }
input[type="text"]:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.2); }
.opt-row { display: flex; gap: .5rem; align-items: center; }
.opt-row input { flex: 1; }
.opt-row button { background: none; border: none; color: #999; cursor: pointer; font-size: 1.25rem; padding: 0 .25rem; }
.opt-row button:hover { color: #ef4444; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: .625rem 1.25rem; border-radius: 8px; font-size: .9375rem; font-weight: 500; cursor: pointer; border: none; transition: background .15s; }
.btn-primary { background: #6366f1; color: #fff; width: 100%; }
.btn-primary:hover { background: #4f46e5; }
.btn-outline { background: none; border: 1px solid #ddd; color: #666; font-size: .8125rem; }
.btn-outline:hover { border-color: #aaa; }
.share-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
.share-box p { font-size: .8125rem; color: #166534; margin-bottom: .5rem; }
.share-link { display: block; word-break: break-all; font-size: .8125rem; color: #6366f1; background: #fff; padding: .5rem; border-radius: 6px; border: 1px solid #bbf7d0; }
.option { display: flex; align-items: center; gap: .75rem; padding: .75rem; border: 2px solid #e5e7eb; border-radius: 10px; margin-bottom: .5rem; cursor: pointer; transition: all .15s; position: relative; }
.option:hover { border-color: #6366f1; background: #f8f8ff; }
.option.selected { border-color: #6366f1; background: #eef2ff; }
.option input[type="radio"] { accent-color: #6366f1; width: 1rem; height: 1rem; }
.bar-bg { position: relative; padding: .75rem; border-radius: 10px; margin-bottom: .5rem; overflow: hidden; }
.bar-fill { position: absolute; inset: 0; background: #eef2ff; border-radius: 10px; transition: width .4s ease; }
.bar-label { position: relative; display: flex; justify-content: space-between; z-index: 1; }
.bar-text { font-weight: 500; }
.bar-pct { color: #6366f1; font-weight: 600; }
.total { text-align: center; color: #888; font-size: .8125rem; margin-top: .75rem; }
.add-opt { margin-top: .25rem; }
.text-sm { font-size: .8125rem; color: #888; }
.mt-2 { margin-top: .75rem; }
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <template v-if="mode === 'create'">
      <h1>Create a Poll</h1>
      <label>Question</label>
      <input v-model="question" type="text" placeholder="What's your question?" @keyup.enter="addOption">
      <label>Options ({{ options.length }})</label>
      <div v-for="(opt, i) in options" :key="i" class="opt-row">
        <input v-model="options[i]" type="text" :placeholder="'Option ' + (i + 1)">
        <button v-if="options.length > 2" @click="options.splice(i, 1)" title="Remove">&times;</button>
      </div>
      <button v-if="options.length < 5" class="btn btn-outline add-opt" @click="options.push('')">+ Add option</button>
      <button class="btn btn-primary mt-2" @click="createPoll" :disabled="!valid">Create Poll</button>
      <div v-if="shareUrl" class="share-box">
        <p>Share this link:</p>
        <div class="share-link">{{ shareUrl }}</div>
        <button class="btn btn-outline mt-2" @click="copyLink">Copy link</button>
      </div>
    </template>
    <template v-else-if="mode === 'vote'">
      <h1>{{ poll.question }}</h1>
      <div v-if="!voted">
        <div v-for="(opt, i) in poll.options" :key="i" class="option" @click="vote(i)">
          <input type="radio" :checked="false">
          <span>{{ opt.text }}</span>
        </div>
      </div>
      <div v-else>
        <div v-for="(opt, i) in poll.options" :key="i" class="bar-bg">
          <div class="bar-fill" :style="{ width: pct(i) + '%' }"></div>
          <div class="bar-label">
            <span class="bar-text">{{ opt.text }}</span>
            <span class="bar-pct">{{ opt.votes }} ({{ pct(i) }}%)</span>
          </div>
        </div>
        <div class="total">{{ totalVotes }} vote{{ totalVotes !== 1 ? 's' : '' }}</div>
      </div>
    </template>
    <template v-else-if="mode === 'notfound'">
      <h1>Poll not found</h1>
      <p class="text-sm mt-2">This poll doesn't exist or has been removed.</p>
      <button class="btn btn-outline mt-2" @click="goHome">Create a poll</button>
    </template>
  </div>
</div>
<script>
const POLLS_KEY = 'quickpoll_polls'
const VOTED_KEY = 'quickpoll_voted'

function load() { try { return JSON.parse(localStorage.getItem(POLLS_KEY)) || {} } catch { return {} } }
function save(polls) { localStorage.setItem(POLLS_KEY, JSON.stringify(polls)) }
function loadVoted() { try { return JSON.parse(localStorage.getItem(VOTED_KEY)) || {} } catch { return {} } }
function saveVoted(v) { localStorage.setItem(VOTED_KEY, JSON.stringify(v)) }

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }

const { createApp, ref, computed, onMounted, watch } = Vue

createApp({
  setup() {
    const mode = ref('create')
    const question = ref('')
    const options = ref(['', ''])
    const shareUrl = ref('')
    const pollId = ref('')
    const poll = ref(null)
    const voted = ref(false)

    const valid = computed(() => question.value.trim() && options.value.filter(o => o.trim()).length >= 2)

    function createPoll() {
      const opts = options.value.filter(o => o.trim()).map(text => ({ text: text.trim(), votes: 0 }))
      const id = genId()
      const polls = load()
      polls[id] = { question: question.value.trim(), options: opts }
      save(polls)
      shareUrl.value = location.origin + location.pathname + '#' + id
    }

    function copyLink() {
      navigator.clipboard.writeText(shareUrl.value)
    }

    function loadPoll(id) {
      const polls = load()
      if (!polls[id]) { mode.value = 'notfound'; return }
      pollId.value = id
      poll.value = polls[id]
      const votedPolls = loadVoted()
      voted.value = !!votedPolls[id]
      mode.value = 'vote'
    }

    function vote(idx) {
      const polls = load()
      const p = polls[pollId.value]
      if (!p) return
      p.options[idx].votes++
      save(polls)
      poll.value = p
      voted.value = true
      const v = loadVoted()
      v[pollId.value] = true
      saveVoted(v)
    }

    function pct(i) {
      const total = poll.value.options.reduce((s, o) => s + o.votes, 0)
      return total === 0 ? 0 : Math.round(poll.value.options[i].votes / total * 100)
    }

    const totalVotes = computed(() => poll.value ? poll.value.options.reduce((s, o) => s + o.votes, 0) : 0)

    function goHome() {
      location.hash = ''
      mode.value = 'create'
      shareUrl.value = ''
    }

    onMounted(() => {
      const id = location.hash.slice(1)
      if (id) loadPoll(id)
    })

    watch(question, () => { shareUrl.value = '' })

    return { mode, question, options, shareUrl, poll, voted, selected, valid, createPoll, copyLink, vote, pct, totalVotes, goHome }
  }
}).mount('#app')
</script>
</body>
</html>
