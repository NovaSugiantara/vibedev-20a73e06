<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Poll</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · component: poll-card · genre: playful · theme: Coral
 * state: default · hover · active · focus · disabled · loading · success
 * contrast: pass (46–50)
 * Pre-emit critique: P5 H4 E5 S4 R5 V5
 */

:root {
  --color-paper: oklch(0.96 0.008 75);
  --color-surface: oklch(0.99 0.004 75);
  --color-text: oklch(0.22 0.015 75);
  --color-text-2: oklch(0.45 0.02 75);
  --color-text-3: oklch(0.62 0.015 75);
  --color-accent: oklch(0.62 0.18 35);
  --color-accent-hover: oklch(0.55 0.18 35);
  --color-accent-soft: oklch(0.92 0.04 35);
  --color-accent-glow: oklch(0.62 0.18 35 / 0.2);
  --color-border: oklch(0.88 0.01 75);
  --color-border-hover: oklch(0.78 0.015 75);
  --color-success: oklch(0.62 0.14 145);
  --color-success-soft: oklch(0.95 0.03 145);
  --color-success-border: oklch(0.85 0.06 145);
  --shadow-card: 0 1px 3px oklch(0 0 0 / 0.04), 0 4px 16px oklch(0 0 0 / 0.06);
  --shadow-btn: 0 2px 8px oklch(0.62 0.18 35 / 0.3);
  --font-display: 'Sora', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --radius-sm: 0.625rem;
  --radius-md: 0.875rem;
  --radius-lg: 1.125rem;
}

body { font-family: var(--font-body); background: var(--color-paper); color: var(--color-text); -webkit-font-smoothing: antialiased; }

h1, .font-display { font-family: var(--font-display); }

input::placeholder { color: var(--color-text-3); }

.card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 1.75rem; border: 1px solid var(--color-border); }

.opt-card { border-color: var(--color-border); transition: border-color .2s, background .2s, transform .2s, box-shadow .2s; background: var(--color-surface); }
.opt-card:hover { border-color: var(--color-accent); background: var(--color-accent-soft); transform: translateX(3px); box-shadow: 0 2px 8px oklch(0 0 0 / 0.04); }
.opt-card:active { transform: translateX(3px) scale(.985); }
.opt-num { background: oklch(0.94 0.008 75); color: var(--color-text-2); transition: background .2s, color .2s; }
.opt-card:hover .opt-num { background: var(--color-accent); color: #fff; }

.bar-fill { transition: width .6s cubic-bezier(.22,1,.36,1); background: linear-gradient(90deg, var(--color-accent-soft), oklch(0.88 0.06 35)); }

.fade-enter-active, .fade-leave-active { transition: opacity .25s ease, transform .2s ease; }
.fade-enter-from { opacity: 0; transform: translateY(8px); }
.fade-leave-to { opacity: 0; transform: translateY(-4px); }

@keyframes check-in { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
.check-in { animation: check-in .35s cubic-bezier(.22,1,.36,1); }
</style>
</head>
<body class="min-h-screen flex justify-center p-6 sm:p-8">
<div id="app" class="w-full max-w-[480px] flex flex-col gap-4">

  <template v-if="mode === 'create'">
    <div class="card">
      <h1 class="text-[1.35rem] font-bold mb-5 leading-tight" style="font-family:var(--font-display)">Create a Poll</h1>
      <template v-if="!shareUrl">
        <label class="block text-[0.75rem] font-semibold mb-1.5 uppercase tracking-[0.05em]" style="color:var(--color-text-2)">Question</label>
        <input v-model="question" type="text" placeholder="What's your question?" ref="qInput" maxlength="200"
          class="w-full px-3.5 py-2.5 rounded-xl text-[0.9375rem] mb-3 transition-all bg-white border"
          style="border-color:var(--color-border);color:var(--color-text)"
          @focus="$el.style.borderColor='var(--color-accent)';$el.style.boxShadow='0 0 0 3px var(--color-accent-glow)'"
          @blur="$el.style.borderColor='var(--color-border)';$el.style.boxShadow='none'">

        <div class="text-[0.75rem] font-semibold mb-2.5 uppercase tracking-[0.05em]" style="color:var(--color-text-2)">Options</div>
        <div v-for="(opt, i) in options" :key="i" class="flex gap-2 items-center mb-2 last:mb-0">
          <input v-model="options[i]" type="text" :placeholder="'Option ' + (i + 1)" maxlength="100"
            class="flex-1 px-3.5 py-2.5 rounded-xl text-[0.9375rem] transition-all bg-white border"
            style="border-color:var(--color-border);color:var(--color-text)"
            @focus="$el.style.borderColor='var(--color-accent)';$el.style.boxShadow='0 0 0 3px var(--color-accent-glow)'"
            @blur="$el.style.borderColor='var(--color-border)';$el.style.boxShadow='none'">
          <button v-if="options.length > 2" @click="options.splice(i, 1)"
            class="bg-transparent border-none p-1.5 leading-none rounded-lg cursor-pointer transition-all text-lg"
            style="color:var(--color-text-3)"
            @mouseenter="$el.style.color='var(--color-accent)'"
            @mouseleave="$el.style.color='var(--color-text-3)'">&times;</button>
        </div>

        <button v-if="options.length < 5" @click="options.push('')"
          class="mt-1.5 inline-flex items-center justify-center px-4 py-2 rounded-xl text-[0.8125rem] font-medium cursor-pointer border-2 border-dashed transition-all w-full bg-transparent"
          style="border-color:var(--color-border);color:var(--color-text-2)"
          @mouseenter="$el.style.borderColor='var(--color-accent)';$el.style.color='var(--color-accent)'"
          @mouseleave="$el.style.borderColor='var(--color-border)';$el.style.color='var(--color-text-2)'">+ Add option</button>

        <button @click="createPoll" :disabled="!valid"
          class="mt-4 inline-flex items-center justify-center px-5 py-3 rounded-xl text-[0.9375rem] font-semibold cursor-pointer border-none transition-all w-full"
          :class="valid ? 'hover:-translate-y-0.5' : ''"
          style="background:var(--color-accent);color:#fff;font-family:var(--font-display)"
          @mouseenter="if(valid)$el.style.boxShadow='var(--shadow-btn)'"
          @mouseleave="$el.style.boxShadow='none'">Create Poll</button>
      </template>

      <div v-else class="rounded-xl p-5" style="background:var(--color-success-soft);border:1px solid var(--color-success-border)">
        <p class="text-[0.8125rem] font-medium mb-2" style="color:var(--color-success)">Share this link:</p>
        <div class="text-[0.8125rem] bg-white px-3.5 py-2.5 rounded-lg break-all select-all mb-3" style="border:1px solid var(--color-success-border);color:var(--color-accent)">{{ shareUrl }}</div>
        <div class="flex gap-2">
          <button @click="copyLink"
            class="flex-1 inline-flex items-center justify-center px-4 py-2.5 rounded-xl text-[0.8125rem] font-medium cursor-pointer border-2 transition-all bg-white"
            style="border-color:var(--color-border);color:var(--color-text)"
            @mouseenter="$el.style.borderColor='var(--color-accent)';$el.style.color='var(--color-accent)'"
            @mouseleave="$el.style.borderColor='var(--color-border)';$el.style.color='var(--color-text)'">{{ copied ? 'Copied!' : 'Copy link' }}</button>
          <button @click="goHome"
            class="flex-1 inline-flex items-center justify-center px-4 py-2.5 rounded-xl text-[0.8125rem] font-medium cursor-pointer border-2 transition-all bg-white"
            style="border-color:var(--color-border);color:var(--color-text)"
            @mouseenter="$el.style.borderColor='var(--color-accent)';$el.style.color='var(--color-accent)'"
            @mouseleave="$el.style.borderColor='var(--color-border)';$el.style.color='var(--color-text)'">Create another</button>
        </div>
      </div>
    </div>
  </template>

  <template v-else-if="mode === 'vote'">
    <div class="card">
      <h1 class="text-[1.35rem] font-bold mb-5 leading-tight" style="font-family:var(--font-display)">{{ poll.question }}</h1>
      <div v-if="!voted">
        <div v-for="(opt, i) in poll.options" :key="i" class="opt-card flex items-center gap-3 px-4 py-3.5 rounded-xl mb-2.5 cursor-pointer border-2" @click="vote(i)">
          <span class="opt-num w-8 h-8 rounded-full flex items-center justify-center text-[0.8125rem] font-bold shrink-0">{{ i + 1 }}</span>
          <span class="font-medium text-[0.9375rem]">{{ opt.text }}</span>
        </div>
      </div>
      <div v-else>
        <div v-for="(opt, i) in poll.options" :key="i" class="mb-2.5 last:mb-0 check-in" :style="{ animationDelay: (i * 0.06) + 's' }">
          <div class="relative px-4 py-3.5 rounded-xl overflow-hidden" style="background:var(--color-accent-soft);">
            <div class="bar-fill absolute inset-0 rounded-xl" :style="{ width: pct(i) + '%' }"></div>
            <div class="relative flex justify-between items-center z-10">
              <span class="font-semibold text-[0.9375rem] break-words pr-2">{{ opt.text }}</span>
              <span class="font-bold text-sm whitespace-nowrap" style="color:var(--color-accent)">{{ pct(i) }}% <span class="text-[0.75rem] font-medium" style="color:var(--color-text-3)">({{ opt.votes }})</span></span>
            </div>
          </div>
        </div>
        <div class="text-center mt-4 pt-4 text-[0.8125rem]" style="color:var(--color-text-3);border-top:1px solid var(--color-border)">{{ totalVotes }} vote{{ totalVotes !== 1 ? 's' : '' }}</div>
      </div>
    </div>
  </template>

  <template v-else-if="mode === 'notfound'">
    <div class="card text-center py-12">
      <div class="text-5xl mb-4 font-bold" style="color:var(--color-text-3);font-family:var(--font-display)">?</div>
      <h1 class="text-[1.35rem] font-bold mb-1.5 leading-tight" style="font-family:var(--font-display)">Poll not found</h1>
      <p class="text-sm mb-6" style="color:var(--color-text-2)">This poll doesn't exist or has been removed.</p>
      <button @click="goHome"
        class="inline-flex items-center justify-center px-5 py-3 rounded-xl text-[0.9375rem] font-semibold cursor-pointer border-none transition-all"
        style="background:var(--color-accent);color:#fff;font-family:var(--font-display)"
        @mouseenter="$el.style.boxShadow='var(--shadow-btn)'"
        @mouseleave="$el.style.boxShadow='none'">Create a poll</button>
    </div>
  </template>

</div>
<script>
const POLLS_KEY = 'quickpoll_polls'
const VOTED_KEY = 'quickpoll_voted'

function load(k) { try { return JSON.parse(localStorage.getItem(k)) || {} } catch { return {} } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }

const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue

createApp({
  setup() {
    const mode = ref('create')
    const question = ref('')
    const options = ref(['', ''])
    const shareUrl = ref('')
    const pollId = ref('')
    const poll = ref(null)
    const voted = ref(false)
    const copied = ref(false)
    const qInput = ref(null)

    const valid = computed(() => question.value.trim() && options.value.filter(o => o.trim()).length >= 2)

    function createPoll() {
      if (!valid.value) return
      const opts = options.value.filter(o => o.trim()).map(text => ({ text: text.trim(), votes: 0 }))
      const id = genId()
      const polls = load(POLLS_KEY)
      polls[id] = { question: question.value.trim(), options: opts }
      save(POLLS_KEY, polls)
      shareUrl.value = location.origin + location.pathname + '#' + id
    }

    function copyLink() {
      navigator.clipboard.writeText(shareUrl.value).then(() => {
        copied.value = true
        setTimeout(() => { copied.value = false }, 2000)
      }).catch(() => {})
    }

    function loadPoll(id) {
      if (!id) return
      const polls = load(POLLS_KEY)
      if (!polls[id]) { mode.value = 'notfound'; return }
      pollId.value = id
      poll.value = polls[id]
      voted.value = !!load(VOTED_KEY)[id]
      mode.value = 'vote'
    }

    function vote(idx) {
      if (voted.value) return
      const polls = load(POLLS_KEY)
      const p = polls[pollId.value]
      if (!p || !p.options[idx]) return
      p.options[idx].votes++
      save(POLLS_KEY, polls)
      poll.value = p
      voted.value = true
      const v = load(VOTED_KEY)
      v[pollId.value] = true
      save(VOTED_KEY, v)
    }

    function pct(i) {
      const total = poll.value.options.reduce((s, o) => s + o.votes, 0)
      return total === 0 ? 0 : Math.round(poll.value.options[i].votes / total * 100)
    }

    const totalVotes = computed(() => poll.value ? poll.value.options.reduce((s, o) => s + o.votes, 0) : 0)

    function goHome() {
      location.hash = ''
      mode.value = 'create'
      shareUrl.value = ''
      copied.value = false
      pollId.value = ''
      question.value = ''
      options.value = ['', '']
      nextTick(() => qInput.value?.focus())
    }

    function onHashChange() {
      const id = location.hash.slice(1)
      if (id) loadPoll(id)
      else goHome()
    }

    onMounted(() => {
      onHashChange()
      window.addEventListener('hashchange', onHashChange)
    })

    onUnmounted(() => window.removeEventListener('hashchange', onHashChange))

    return { mode, question, options, shareUrl, poll, voted, copied, qInput, valid, createPoll, copyLink, vote, pct, totalVotes, goHome }
  }
}).mount('#app')
</script>
</body>
</html>
